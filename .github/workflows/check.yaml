# Checks only: production is deployed from main (see README), so PRs are the only place these need to run.
name: Check tools

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Audit workflows
        run: uvx --from prek==0.5.7 prek run zizmor --all-files

  build:
    # Same commands as Workers Builds, so a red check means Cloudflare would fail too.
    name: Build and dry-run deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build and dry-run Cloudflare deploy
        run: pnpm check
      # The runner image already ships Chromium's libraries; --with-deps only adds a
      # ~1 min apt run. Tests use full Chromium, so skip the headless shell too.
      - name: Install Chromium
        run: pnpm exec playwright install --no-shell chromium
      - name: Run browser tests
        run: pnpm test
